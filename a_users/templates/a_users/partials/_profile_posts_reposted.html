{% if profile_reposts %}
<div class="grid gap-4 grid-cols-2 md:grid-cols-[repeat(auto-fill,_minmax(170px,_1fr))] py-4">         
    {% for post in profile_reposts %}
    <div id="reposts_{{ post.uuid }}">
    {% include 'a_users/partials/_profile_post.html' %}
    </div>
    {% endfor %}
</div>
{% else %}
<div class="text-center pt-32">
    <div class="font-bold text-2xl">ยังไม่มีการรีโพสต์</div>
    {% if profile_user == user %}
    <div class="mt-2">เนื้อหาที่ท่านรีโพสต์จะปรากฎตรงนี้</div>
    {% endif %}
</div>
{% endif %}
