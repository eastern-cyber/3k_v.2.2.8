<!-- templates/base.html -->
{% load static %}
{% load django_htmx %}
<!DOCTYPE html>
<html lang="en" x-data="{ darkMode: {{ user.darkmode|yesno:'true,false' }} }" :class="{ 'dark': darkMode }">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="csrf-token" content="{{ csrf_token }}">
        <title>{% block title %}{% endblock %}KokKokKok</title>
        <link rel="shortcut icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}" >
        <meta property="og:site_name" content="KokKokKok Clone">
        <meta property="og:url" content="{{ request.build_absolute_uri }}">
        {% block meta_tags %}
        <meta property="og:title" content="Welcome to KokKokKok Clone">
        <meta property="og:description" content="Share and discover posts!">
        <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'images/favicon.ico' %}">
        <meta property="og:type" content="website">
        <meta name="twitter:card" content="summary">
        <meta name="twitter:title" content="Welcome to KokKokKok Clone">
        <meta name="twitter:description" content="Share and discover posts!">
        <meta name="twitter:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'images/favicon.ico' %}">
        {% endblock %}
        {% htmx_script %}
        <script defer src="https://cdn.jsdelivr.net/npm/htmx-ext-ws"></script>
        <!-- Load Alpine.js Collapse plugin FIRST -->
        <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
        <!-- Then load Alpine.js core -->
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>
        <link href="{% static 'css/style.css' %}" rel="stylesheet">
    </head>
<body x-data="mainApp()" x-init="init()" class="dark:bg-black dark:text-white dark:fill-white" hx-headers='{"x-csrftoken": "{{ csrf_token }}"}'>

{% include 'includes/modal.html' %}

{% block layout %}
{% endblock %}

<script>
function mainApp() {
    return {
        modalPage: false,
        modalBox: false,
        returnUrl: window.location.pathname,
        darkMode: {{ user.darkmode|yesno:'true,false' }},
        
        init() {
            // Initialize dark mode
            if (this.darkMode) {
                document.documentElement.classList.add('dark');
            }
            
            // Watch for modal changes
            this.$watch('modalPage', (value) => {
                if (!value) {
                    const content = document.getElementById('modalpage-content');
                    if (content) content.innerHTML = '';
                    // Restore feed videos when modal closes
                    this.restoreFeedVideos();
                }
                // Toggle body scroll
                document.body.style.overflow = value ? 'hidden' : '';
                
                // Pause feed videos when modal opens
                if (value) {
                    this.pauseFeedVideos();
                }
            });
            
            this.$watch('modalBox', (value) => {
                if (!value) {
                    const content = document.getElementById('modalbox-content');
                    if (content) content.innerHTML = '';
                }
            });
        },
        
        pauseFeedVideos() {
            // Pause all feed videos and store their state
            document.querySelectorAll('article video[x-ref="videoPlayer"]').forEach(video => {
                if (!video.paused) {
                    video.dataset.wasPlaying = 'true';
                    video.pause();
                } else {
                    video.dataset.wasPlaying = 'false';
                }
                // Also mute them to prevent audio bleeding
                video.dataset.wasMuted = video.muted;
                video.muted = true;
            });
        },
        
        restoreFeedVideos() {
            // Restore feed videos to their previous state
            document.querySelectorAll('article video[x-ref="videoPlayer"]').forEach(video => {
                // Restore mute state
                if (video.dataset.wasMuted !== undefined) {
                    video.muted = video.dataset.wasMuted === 'true';
                }
                // Restore play state if it was playing
                if (video.dataset.wasPlaying === 'true') {
                    video.play().catch(() => {});
                }
                // Clean up dataset attributes
                delete video.dataset.wasPlaying;
                delete video.dataset.wasMuted;
            });
        },
        
        closeModal() {
            this.modalPage = false;
            const content = document.getElementById('modalpage-content');
            if (content) content.innerHTML = '';
            window.history.replaceState({}, '', this.returnUrl || '/');
            document.body.style.overflow = '';
        },
        
        closeBox() {
            this.modalBox = false;
            const content = document.getElementById('modalbox-content');
            if (content) content.innerHTML = '';
        },
        
        openModal(url) {
            this.modalPage = true;
            this.returnUrl = window.location.pathname;
            // HTMX will handle the content loading
        }
    }
}

// Handle HTMX OOB errors gracefully
document.addEventListener('htmx:oobErrorNoTarget', function(evt) {
    // Silent ignore - this is expected for OOB swaps in modal context
    evt.preventDefault();
});

// ======== HELPER: Convert plain string to UTF-8 hex with 0x prefix ========
function utf8ToHex(str) {
    const utf8Bytes = new TextEncoder().encode(str);
    return '0x' + Array.from(utf8Bytes)
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
}
// ========================================================================

function walletLogin() {
    return {
        address: null,
        isLoading: false,
        buttonText: 'Connect Wallet',
        errorMessage: '',

        init() {
            // Optional: check if already connected (e.g., after page reload)
            if (window.ethereum && window.ethereum.selectedAddress) {
                this.address = window.ethereum.selectedAddress;
                this.buttonText = this.address.slice(0, 6) + '...' + this.address.slice(-4);
            }
        },

        async connectWallet() {
            this.isLoading = true;
            this.errorMessage = '';

            try {
                // 1. Check for MetaMask / TrustWallet / etc.
                if (!window.ethereum) {
                    throw new Error('Please install a crypto wallet like MetaMask or TrustWallet.');
                }

                // 2. Request account access
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const walletAddress = accounts[0];
                this.address = walletAddress;
                this.buttonText = walletAddress.slice(0, 6) + '...' + walletAddress.slice(-4);

                // 3. Get nonce from your Django backend
                const nonceResponse = await fetch('/api/wallet/nonce/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address: walletAddress })
                });
                const nonceData = await nonceResponse.json();
                if (!nonceResponse.ok) {
                    throw new Error(nonceData.error || 'Failed to get nonce');
                }
                const nonce = nonceData.nonce;

                // ========== FIX: Convert nonce to UTF-8 hex before signing ==========
                const hexNonce = utf8ToHex(nonce);
                // ===================================================================

                // 4. Sign the nonce with the wallet (using hexNonce)
                const signature = await window.ethereum.request({
                    method: 'personal_sign',
                    params: [hexNonce, walletAddress]   // <-- changed from nonce to hexNonce
                });

                // 5. Send signature to your backend for verification
                const verifyResponse = await fetch('/api/wallet/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.querySelector('meta[name="csrf-token"]')?.content || ''
                    },
                    body: JSON.stringify({
                        address: walletAddress,
                        signature: signature
                    })
                });
                const verifyData = await verifyResponse.json();

                if (!verifyResponse.ok) {
                    throw new Error(verifyData.error || 'Verification failed');
                }

                // 6. Success! Reload the page to reflect the logged-in user.
                window.location.reload();

            } catch (error) {
                console.error(error);
                this.errorMessage = error.message;
                this.buttonText = 'Connect Wallet';
            } finally {
                this.isLoading = false;
            }
        }
    }
}

// ========== VIDEO PLAYER - Feed specific ==========
// This is the global setting for feed videos (unmuted by default)
window.userWantsSound = true; // Changed to true for feed videos
window.currentlyPlayingVideo = null;

function videoPlayer(src) {
    return {
        src,
        playing: false,
        // Feed videos start unmuted (false = NOT muted)
        muted: false,
        userPaused: false,
        ready: false,
        showTapIcon: false,

        init() {
            const video = this.$refs.videoPlayer;
            // Feed videos unmuted by default
            this.muted = false;
            video.muted = false;
            this.observeVideo(video);
            this.ready = true;
        },

        observeVideo(video) {
            const observer = new IntersectionObserver(([entry]) => {
                // Don't autoplay if modal is open
                if (window.modalPageOpen) {
                    return;
                }
                
                if (window.pauseAllVideosFlag) {
                    video.pause();
                    video.muted = true;
                    return;
                }

                if (entry.isIntersecting && !this.userPaused) {
                    if (window.currentlyPlayingVideo && window.currentlyPlayingVideo !== video) {
                        window.currentlyPlayingVideo.pause();
                    }
                    window.currentlyPlayingVideo = video;
                    // Keep feed videos unmuted when playing
                    video.muted = this.muted;
                    video.play().catch(() => {});
                } else if (!entry.isIntersecting) {
                    if (window.currentlyPlayingVideo === video) {
                        window.currentlyPlayingVideo = null;
                    }
                    video.pause();
                }
            }, { threshold: 0.6 });
            observer.observe(video);
        },

        togglePlay() {
            const video = this.$refs.videoPlayer;
            if (video.paused) {
                this.userPaused = false;
                this.playing = true;
                this.$nextTick(() => this.showTapIcon = true);
                if (window.currentlyPlayingVideo && window.currentlyPlayingVideo !== video) {
                    window.currentlyPlayingVideo.pause();
                }
                window.currentlyPlayingVideo = video;
                video.muted = this.muted;
                video.play();
            } else {
                this.userPaused = true;
                this.playing = false;
                this.$nextTick(() => this.showTapIcon = true);
                video.pause();
                if (window.currentlyPlayingVideo === video) window.currentlyPlayingVideo = null;
            };

            this.$nextTick(() => {
                this.showTapIcon = true;
            });

            setTimeout(() => {
                this.showTapIcon = false;
            }, 700); 
        },

        toggleMute() {
            const video = this.$refs.videoPlayer;
            this.muted = !this.muted;
            video.muted = this.muted;
            window.userWantsSound = !this.muted;
        }
    }
}

// Track modal state globally
window.modalPageOpen = false;

// HTMX event handler for modal content
document.body.addEventListener('htmx:afterSwap', (e) => {
    if (e.target.id === 'modalpage-content') {
        // Modal is now open
        window.modalPageOpen = true;
        
        // Force all feed videos to pause and mute
        document.querySelectorAll('article video[x-ref="videoPlayer"]').forEach(video => {
            if (!video.paused) {
                video.dataset.wasPlaying = 'true';
                video.pause();
            } else {
                video.dataset.wasPlaying = 'false';
            }
            video.dataset.wasMuted = video.muted;
            video.muted = true;
        });
    }
});

// Also handle when modal content is removed (modal closed)
document.addEventListener('htmx:beforeSwap', (e) => {
    if (e.detail.target && e.detail.target.id === 'modalpage-content' && !e.detail.target.innerHTML) {
        // Modal is closing
        window.modalPageOpen = false;
        
        // Restore feed videos
        document.querySelectorAll('article video[x-ref="videoPlayer"]').forEach(video => {
            if (video.dataset.wasMuted !== undefined) {
                video.muted = video.dataset.wasMuted === 'true';
            }
            if (video.dataset.wasPlaying === 'true') {
                video.play().catch(() => {});
            }
            delete video.dataset.wasPlaying;
            delete video.dataset.wasMuted;
        });
    }
});

// Clean up modal state when using close button
document.addEventListener('click', (e) => {
    if (e.target.closest('[x-data="mainApp()"]') && e.target.closest('[x-data="mainApp()"]').__x?.$data?.modalPage === false) {
        window.modalPageOpen = false;
    }
});
</script>

</body>
</html>
