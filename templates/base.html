{% load static %}
{% load django_htmx %}
<!DOCTYPE html>
<html lang="en" x-data="{ darkMode: {{ user.darkmode|yesno:'true,false' }} }" :class="{ 'dark': darkMode }">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}{% endblock %}KokKokKok</title>
        <link rel="shortcut icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}" >
        <meta property="og:site_name" content="KokKokKok Clone">
        <meta property="og:url" content="{{ request.build_absolute_uri }}">
        {% block meta_tags %}
        <meta property="og:title" content="Welcome to KokKokKok Clone">
        <meta property="og:description" content="Share and discover posts!">
        <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'images/favicon.ico' %}">
        <meta property="og:type" content="website">
        <meta name="twitter:card" content="summary">
        <meta name="twitter:title" content="Welcome to KokKokKok Clone">
        <meta name="twitter:description" content="Share and discover posts!">
        <meta name="twitter:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'images/favicon.ico' %}">
        {% endblock %}
        {% htmx_script %}
        <script defer src="https://cdn.jsdelivr.net/npm/htmx-ext-ws"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>
        <link href="{% static 'css/style.css' %}" rel="stylesheet">
    </head>
<body x-data="{ modalPage: false, modalBox: false }" class="dark:bg-black dark:text-white dark:fill-white" hx-headers='{"x-csrftoken": "{{ csrf_token }}"}'>

{% include 'includes/modal.html' %}

{% block layout %}
{% endblock %}

<script>
(function() {
    'use strict';
    
    function updatePostpageAudio() {
        const postpage = document.getElementById('postpage-content');
        const hasPostpage = !!postpage && postpage.isConnected;
        
        // Toggle class for CSS (hides feed mute buttons when detail is open)
        document.body.classList.toggle('postpage-active', hasPostpage);
        
        // No post detail open — do NOTHING. Let Alpine handle the feed.
        if (!hasPostpage) {
            // Optional: restore feed videos based on user's last choice
            document.querySelectorAll('article video').forEach(v => {
                v.muted = !window.userWantsSound;
            });
            return;
        }
        
        const mainVideo = postpage.querySelector('video[data-main-video]');
        if (!mainVideo) return;
        
        // Mute all videos OUTSIDE the post detail (feed videos in background)
        document.querySelectorAll('video').forEach(v => {
            if (!postpage.contains(v)) {
                v.muted = true;
            }
        });
        
        // Unmute the active post's main video
        if (mainVideo.muted) {
            mainVideo.muted = false;
        }
        
        // Enforce single-audio: if user unmutes manually, mute everything else
        mainVideo.removeEventListener('volumechange', onMainVolumeChange);
        mainVideo.addEventListener('volumechange', onMainVolumeChange);
    }
    
    function onMainVolumeChange(e) {
        const video = e.target;
        if (!video.muted) {
            document.querySelectorAll('video').forEach(v => {
                if (v !== video && !v.muted) v.muted = true;
            });
        }
    }
    
    // Initial load
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', updatePostpageAudio);
    } else {
        updatePostpageAudio();
    }
    
    // After HTMX swaps (prev/next navigation)
    document.body.addEventListener('htmx:afterSettle', updatePostpageAudio);
    
    // Detect modal open/close (Alpine x-show or direct DOM removal)
    const observer = new MutationObserver(() => updatePostpageAudio());
    observer.observe(document.body, { childList: true, subtree: true });
})();
</script>

</body>
</html>
