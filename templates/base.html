{% load static %}
{% load django_htmx %}
<!DOCTYPE html>
<html lang="en" x-data="{ darkMode: {{ user.darkmode|yesno:'true,false' }} }" :class="{ 'dark': darkMode }">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="csrf-token" content="{{ csrf_token }}">
        <title>{% block title %}{% endblock %}KokKokKok</title>
        <link rel="shortcut icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}" >
        <meta property="og:site_name" content="KokKokKok Clone">
        <meta property="og:url" content="{{ request.build_absolute_uri }}">
        {% block meta_tags %}
        <meta property="og:title" content="Welcome to KokKokKok Clone">
        <meta property="og:description" content="Share and discover posts!">
        <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'images/favicon.ico' %}">
        <meta property="og:type" content="website">
        <meta name="twitter:card" content="summary">
        <meta name="twitter:title" content="Welcome to KokKokKok Clone">
        <meta name="twitter:description" content="Share and discover posts!">
        <meta name="twitter:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'images/favicon.ico' %}">
        {% endblock %}
        {% htmx_script %}
        <script defer src="https://cdn.jsdelivr.net/npm/htmx-ext-ws"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>
        <link href="{% static 'css/style.css' %}" rel="stylesheet">
    </head>
<body x-data="{ modalPage: false, modalBox: false }" class="dark:bg-black dark:text-white dark:fill-white" hx-headers='{"x-csrftoken": "{{ csrf_token }}"}'>

{% include 'includes/modal.html' %}

{% block layout %}
{% endblock %}

<script>
(function() {
    'use strict';
    
    const PREV_MUTED = 'data-prev-muted';
    const SCRIPT_MUTED = 'data-script-muted';
    
    function updatePostpageAudio() {
        const postpage = document.getElementById('postpage-content');
        // Check if element exists AND is actually visible (not inside a display:none modal)
        const hasPostpage = !!(postpage && postpage.offsetParent !== null);
        
        // CSS helper: hide feed mute buttons when detail is open
        document.body.classList.toggle('postpage-active', hasPostpage);
        
        // ── No post detail open ─────────────────────────────
        if (!hasPostpage) {
            document.querySelectorAll('video[' + SCRIPT_MUTED + ']').forEach(v => {
                const wasMuted = v.getAttribute(PREV_MUTED) === 'true';
                v.muted = wasMuted;
                v.removeAttribute(SCRIPT_MUTED);
                v.removeAttribute(PREV_MUTED);
            });
            return;
        }
        
        // ── Post detail is open ─────────────────────────────
        document.querySelectorAll('video').forEach(v => {
            if (!postpage.contains(v)) {
                if (!v.hasAttribute(SCRIPT_MUTED)) {
                    v.setAttribute(PREV_MUTED, v.muted);
                    v.setAttribute(SCRIPT_MUTED, '');
                }
                v.muted = true;
            }
        });
        
        // Unmute the active post's main video
        const mainVideo = postpage.querySelector('video[data-main-video]');
        if (mainVideo) {
            mainVideo.muted = false;
            mainVideo.removeEventListener('volumechange', onMainVolumeChange);
            mainVideo.addEventListener('volumechange', onMainVolumeChange);
        }
    }
    
    function onMainVolumeChange(e) {
        const video = e.target;
        if (!video.muted) {
            document.querySelectorAll('video').forEach(v => {
                if (v !== video && !v.muted) v.muted = true;
            });
        }
    }
    
    // Run on initial load
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', updatePostpageAudio);
    } else {
        updatePostpageAudio();
    }
    
    // HTMX swaps (open post, prev/next, explore tag changes, etc.)
    document.body.addEventListener('htmx:afterSettle', updatePostpageAudio);
    
    // Modal open/close detection: watch ONLY #modalpage-content, not the entire DOM tree
    const modalContent = document.getElementById('modalpage-content');
    if (modalContent) {
        const observer = new MutationObserver(() => updatePostpageAudio());
        observer.observe(modalContent, { childList: true });
    }
})();

function walletLogin() {
    return {
        address: null,
        isLoading: false,
        buttonText: 'Connect Wallet',
        errorMessage: '',

        init() {
            // Optional: check if already connected (e.g., after page reload)
            if (window.ethereum && window.ethereum.selectedAddress) {
                this.address = window.ethereum.selectedAddress;
                this.buttonText = this.address.slice(0, 6) + '...' + this.address.slice(-4);
            }
        },

        async connectWallet() {
            this.isLoading = true;
            this.errorMessage = '';

            try {
                // 1. Check for MetaMask / TrustWallet / etc.
                if (!window.ethereum) {
                    throw new Error('Please install a crypto wallet like MetaMask or TrustWallet.');
                }

                // 2. Request account access
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                const walletAddress = accounts[0];
                this.address = walletAddress;
                this.buttonText = walletAddress.slice(0, 6) + '...' + walletAddress.slice(-4);

                // 3. Get nonce from your Django backend
                const nonceResponse = await fetch('/api/wallet/nonce/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address: walletAddress })
                });
                const nonceData = await nonceResponse.json();
                if (!nonceResponse.ok) {
                    throw new Error(nonceData.error || 'Failed to get nonce');
                }
                const nonce = nonceData.nonce;

                // 4. Sign the nonce with the wallet
                const signature = await window.ethereum.request({
                    method: 'personal_sign',
                    params: [nonce, walletAddress]
                });

                // 5. Send signature to your backend for verification
                const verifyResponse = await fetch('/api/wallet/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.querySelector('meta[name="csrf-token"]')?.content || ''
                    },
                    body: JSON.stringify({
                        address: walletAddress,
                        signature: signature
                    })
                });
                const verifyData = await verifyResponse.json();

                if (!verifyResponse.ok) {
                    throw new Error(verifyData.error || 'Verification failed');
                }

                // 6. Success! Reload the page to reflect the logged-in user.
                window.location.reload();

            } catch (error) {
                console.error(error);
                this.errorMessage = error.message;
                this.buttonText = 'Connect Wallet';
            } finally {
                this.isLoading = false;
            }
        }
    }
}
</script>

</body>
</html>
