{% load static %}
{% load django_htmx %}
<!DOCTYPE html>
<html lang="en" x-data="{ darkMode: {{ user.darkmode|yesno:'true,false' }} }" :class="{ 'dark': darkMode }">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}{% endblock %}KokKokKok</title>
        <link rel="shortcut icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}" >
        <meta property="og:site_name" content="KokKokKok Clone">
        <meta property="og:url" content="{{ request.build_absolute_uri }}">
        {% block meta_tags %}
        <meta property="og:title" content="Welcome to KokKokKok Clone">
        <meta property="og:description" content="Share and discover posts!">
        <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'images/favicon.ico' %}">
        <meta property="og:type" content="website">
        <meta name="twitter:card" content="summary">
        <meta name="twitter:title" content="Welcome to KokKokKok Clone">
        <meta name="twitter:description" content="Share and discover posts!">
        <meta name="twitter:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'images/favicon.ico' %}">
        {% endblock %}
        {% htmx_script %}
        <script defer src="https://cdn.jsdelivr.net/npm/htmx-ext-ws"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>
        <link href="{% static 'css/style.css' %}" rel="stylesheet">
    </head>
<body x-data="{ modalPage: false, modalBox: false }" class="dark:bg-black dark:text-white dark:fill-white" hx-headers='{"x-csrftoken": "{{ csrf_token }}"}'>

{% include 'includes/modal.html' %}

{% block layout %}
{% endblock %}

<script>
(function() {
    'use strict';
    
    let currentVideo = null;
    let userInteracted = false;
    let listenersAttached = false;
    
    function unmuteVideo(video) {
        if (!video) return;
        video.muted = false;
        video.volume = 1.0;
        if (video.paused) {
            video.play().catch(() => {});
        }
    }
    
    function attachInteractionListeners() {
        if (listenersAttached) return;
        listenersAttached = true;
        
        const handler = () => {
            userInteracted = true;
            const video = document.querySelector('video[data-main-video]');
            if (video && video.muted) {
                unmuteVideo(video);
            }
        };
        
        ['click', 'touchstart', 'keydown'].forEach(evt => {
            document.addEventListener(evt, handler, { once: true, passive: true });
        });
    }
    
    function managePostVideo() {
        // 1. Mute ALL videos on the page (grid thumbnails, old posts, etc.)
        document.querySelectorAll('video').forEach(v => v.muted = true);
        
        // 2. Find the main active video
        const video = document.querySelector('video[data-main-video]');
        if (!video) {
            currentVideo = null;
            return;
        }
        
        // 3. Already handling this exact element? Skip.
        if (video === currentVideo) return;
        currentVideo = video;
        
        // 4. If user unmutes via native controls, mute every other video immediately
        video.addEventListener('volumechange', function() {
            if (!video.muted) {
                document.querySelectorAll('video').forEach(v => {
                    if (v !== video) v.muted = true;
                });
            }
        });
        
        // 5. Unmute the active video
        if (userInteracted) {
            // User has already interacted — unmute freely
            unmuteVideo(video);
        } else {
            // Try to unmute immediately (may be blocked by browser)
            unmuteVideo(video);
            // Set up one-time listener for first interaction
            attachInteractionListeners();
        }
    }
    
    // Run on initial page load
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', managePostVideo);
    } else {
        managePostVideo();
    }
    
    // Run after HTMX swaps (prev/next post navigation)
    document.body.addEventListener('htmx:afterSettle', managePostVideo);
})();
</script>

</body>
</html>
